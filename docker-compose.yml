version: "3.9"

services:
  tab-gener8or:
    build: .
    ports:
      - "8501:8501"
    environment:
      - PORT=8501
      - PYTHONUNBUFFERED=1
      - TF_CPP_MIN_LOG_LEVEL=3
    # Optional: persist the model cache between restarts
    volumes:
      - model_cache:/root/.cache
    restart: unless-stopped

volumes:
  model_cache:
